name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - name: Testes
        run: python -m pytest -q
      - name: Guarda o banco versionado
        run: cp dados_tratados/projeto_residuos.db "$RUNNER_TEMP/versionado.db"
      - name: ETL refaz o banco a partir das planilhas (confere o IRS3002 contra as rotas)
        run: python scripts/etl_sqlite.py --forcar
      - name: Banco regerado tem o mesmo conteúdo do versionado
        run: python scripts/comparar_bancos.py "$RUNNER_TEMP/versionado.db" dados_tratados/projeto_residuos.db
      - name: CSVs regerados são iguais aos versionados
        run: git diff --exit-code -- dados_tratados/municipios.csv dados_tratados/resultados_indicadores_mpv.csv
      - name: Testes após regerar o banco
        run: python -m pytest -q
