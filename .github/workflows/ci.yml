name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - name: Testes
        run: python -m pytest -q
      - name: ETL reproduz o banco versionado (contagens)
        run: python scripts/etl_sqlite.py
      - name: Testes após regerar o banco
        run: python -m pytest -q
